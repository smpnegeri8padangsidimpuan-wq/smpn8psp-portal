                            <div class="w-9 h-9 bg-blue-100 text-[#1B365D] rounded-xl flex items-center justify-center text-lg">
                                <i class="fa-solid fa-clipboard-user"></i>
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800">Daftar Hadir Siswa</h3>
                                <p class="text-[11px] text-slate-500">${schoolConfig.schoolName}</p>
                            </div>
                        </div>

                        <!-- Tab Tingkat Kelas -->
                        <div class="flex border-b border-slate-200 mb-3">
                            <button onclick="switchClassTab(7)" id="tab-7" class="flex-1 py-2 text-xs font-bold border-b-2 text-center transition-all ${selectedClassTab === 7 ? 'border-[#1B365D] text-[#1B365D]' : 'border-transparent text-slate-400 hover:text-slate-600'}">
                                Kelas 7
                            </button>
                            <button onclick="switchClassTab(8)" id="tab-8" class="flex-1 py-2 text-xs font-bold border-b-2 text-center transition-all ${selectedClassTab === 8 ? 'border-[#1B365D] text-[#1B365D]' : 'border-transparent text-slate-400 hover:text-slate-600'}">
                                Kelas 8
                            </button>
                            <button onclick="switchClassTab(9)" id="tab-9" class="flex-1 py-2 text-xs font-bold border-b-2 text-center transition-all ${selectedClassTab === 9 ? 'border-[#1B365D] text-[#1B365D]' : 'border-transparent text-slate-400 hover:text-slate-600'}">
                                Kelas 9
                            </button>
                        </div>

                        <!-- Container Content Presensi -->
                        <div id="presensiContent">
                            ${renderPresensiContent(selectedClassTab)}
                        </div>
                    </div>
                `;
            } else if (key === 'rekapitulasi') {
                container.innerHTML = `
                    <div class="text-center pt-2">
                        <div class="w-12 h-12 bg-blue-100 text-[#1B365D] rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl">
                            <i class="fa-solid fa-chart-pie"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800">Rekapitulasi Sekolah</h3>
                        <p class="text-xs text-slate-500 mt-0.5">${schoolConfig.schoolName}</p>

                        <div class="grid grid-cols-2 gap-2.5 mt-4">
                            <div class="bg-slate-50 border border-slate-100 p-3 rounded-2xl text-center">
                                <span class="text-2xl font-extrabold text-[#1B365D] block">${schoolConfig.rekap.guru}</span>
                                <span class="text-xs font-semibold text-slate-600">Guru & Staff</span>
                            </div>
                            <div class="bg-slate-50 border border-slate-100 p-3 rounded-2xl text-center">
                                <span class="text-2xl font-extrabold text-indigo-700 block">${schoolConfig.rekap.siswa}</span>
                                <span class="text-xs font-semibold text-slate-600">Siswa Aktif</span>
                            </div>
                            <div class="bg-slate-50 border border-slate-100 p-3 rounded-2xl text-center">
                                <span class="text-2xl font-extrabold text-emerald-700 block">${schoolConfig.rekap.rombel}</span>
                                <span class="text-xs font-semibold text-slate-600">Rombel</span>
                            </div>
                            <div class="bg-slate-50 border border-slate-100 p-3 rounded-2xl text-center">
                                <span class="text-2xl font-extrabold text-amber-600 block">${schoolConfig.rekap.akreditasi}</span>
                                <span class="text-xs font-semibold text-slate-600">Akreditasi BAN-S/M</span>
                            </div>
                        </div>

                        <div class="mt-4 p-3 bg-blue-50 border border-blue-100 rounded-xl text-left text-xs">
                            <p class="font-bold text-[#1B365D] mb-1"><i class="fa-solid fa-bullhorn mr-1"></i>Informasi ${schoolConfig.ta}</p>
                            <p class="text-slate-600 leading-relaxed">
                                Seluruh proses pembelajaran di ${schoolConfig.schoolName} menerapkan Kurikulum Merdeka Terintegrasi Digital.
                            </p>
                        </div>
                    </div>
                `;
            } else if (key === 'adminEditor') {
                container.innerHTML = `
                    <div class="pt-1">
                        <h3 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-sliders text-[#1B365D]"></i> Panel Pengaturan Data Admin
                        </h3>

                        <div class="space-y-3.5 text-xs">
                            <!-- 1. Edit Logo Sekolah PNG -->
                            <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl space-y-2">
                                <h4 class="font-bold text-[#1B365D] flex items-center gap-1.5">
                                    <i class="fa-solid fa-image"></i> Upload Logo Sekolah (PNG)
                                </h4>
                                <input type="file" id="editLogoInput" accept="image/png, image/jpeg, image/svg+xml" class="w-full p-1.5 bg-white border border-slate-300 rounded-lg text-[11px]">
                                <p class="text-[10px] text-slate-500">*Gunakan file format PNG latar transparan untuk hasil terbaik.</p>
                            </div>

                            <!-- 2. Header & Nama Sekolah -->
                            <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                <h4 class="font-bold text-[#1B365D]">Nama Sekolah & TA</h4>
                                <input type="text" id="editSchoolName" value="${schoolConfig.schoolName}" placeholder="Nama Sekolah" class="w-full p-2 border rounded-lg">
                                <input type="text" id="editTA" value="${schoolConfig.ta}" placeholder="Tahun Ajaran" class="w-full p-2 border rounded-lg">
                            </div>

                            <!-- 3. Edit Detail Kepala Sekolah & Upload Foto -->
                            <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                <h4 class="font-bold text-[#1B365D] flex items-center gap-1.5">
                                    <i class="fa-solid fa-user-tie"></i> Edit Data Kepala Sekolah
                                </h4>
                                <input type="text" id="editKepsekNama" value="${schoolConfig.kepalaSekolah.nama}" placeholder="Nama Kepala Sekolah" class="w-full p-2 border rounded-lg">
                                <input type="text" id="editKepsekNIP" value="${schoolConfig.kepalaSekolah.nip}" placeholder="NIP Kepala Sekolah" class="w-full p-2 border rounded-lg">
                                <input type="text" id="editKepsekPangkat" value="${schoolConfig.kepalaSekolah.pangkat}" placeholder="Pangkat / Golongan" class="w-full p-2 border rounded-lg">
                                <div>
                                    <label class="block text-[10px] font-semibold text-slate-600 mb-1">Upload Foto Baru Kepala Sekolah:</label>
                                    <input type="file" id="editKepsekFotoInput" accept="image/*" class="w-full p-1.5 bg-white border border-slate-300 rounded-lg text-[11px]">
                                </div>
                            </div>

                            <!-- 4. Statistik Rekapitulasi -->
                            <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                <h4 class="font-bold text-[#1B365D]">Statistik Rekapitulasi</h4>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="number" id="editJumlahGuru" value="${schoolConfig.rekap.guru}" placeholder="Total Guru" class="p-2 border rounded-lg">
                                    <input type="number" id="editJumlahSiswa" value="${schoolConfig.rekap.siswa}" placeholder="Total Siswa" class="p-2 border rounded-lg">
                                </div>
                            </div>

                            <button onclick="saveAdminChanges()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition-colors shadow-md">
                                Simpan Semua Perubahan
                            </button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('infoModal').classList.remove('hidden');
        }

        // Render Cards Guru
        function renderGuruCards(list) {
            if (list.length === 0) {
                return `<p class="text-center text-xs text-slate-400 py-4">Data guru tidak ditemukan</p>`;
            }
            return list.map(g => `
                <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl text-left hover:border-blue-300 transition-all">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-slate-800 text-xs sm:text-sm">${g.nama}</h4>
                            <p class="text-[11px] text-emerald-600 font-semibold mt-0.5">
                                <i class="fa-solid fa-circle-check text-[9px]"></i> Absen: ${g.absenMasuk || 'Hadir Mengajar'}
                            </p>
                        </div>
                        <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-blue-100 text-[#1B365D]">${g.mapel}</span>
                    </div>
                    ${g.nip ? `<p class="text-[11px] text-slate-400 mt-1">NIP: ${g.nip}</p>` : ''}
                    <div class="mt-2 pt-2 border-t border-slate-200 flex items-center justify-between">
                        <span class="text-[11px] text-indigo-700 font-medium truncate max-w-[180px]">
                            <i class="fa-solid fa-file-pdf mr-1"></i>${g.modul}
                        </span>
                        <div class="flex items-center gap-1">
                            ${isAdminLoggedIn ? `<button onclick="deleteGuru(${g.id})" class="px-2 py-1 bg-rose-600 text-white rounded-lg text-[10px] font-semibold">Hapus</button>` : ''}
                            <button onclick="downloadSimulasi('${g.modul}')" class="px-2.5 py-1 bg-[#1B365D] text-white rounded-lg text-[10px] font-semibold hover:bg-slate-800 transition-colors">Unduh</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterGuruList() {
            const query = document.getElementById('guruSearchInput').value.toLowerCase();
            const filtered = guruList.filter(g => 
                g.nama.toLowerCase().includes(query) || 
                g.mapel.toLowerCase().includes(query) || 
                (g.nip && g.nip.includes(query))
            );
            document.getElementById('guruListContainer').innerHTML = renderGuruCards(filtered);
        }

        function toggleUploadForm() {
            const form = document.getElementById('uploadModulForm');
            form.classList.toggle('hidden');
        }

        function autoFillGuruData() {
            const selectedId = document.getElementById('selectGuruPendidik').value;
            const guru = guruList.find(g => g.id == selectedId);

            if (guru) {
                document.getElementById('newNamaGuru').value = guru.nama;
                document.getElementById('newMapel').value = guru.mapel;
            } else {
                document.getElementById('newNamaGuru').value = '';
                document.getElementById('newMapel').value = '';
            }
        }

        function simpanModulBaru() {
            const selectedId = document.getElementById('selectGuruPendidik').value;
            const nama = document.getElementById('newNamaGuru').value.trim();
            const mapel = document.getElementById('newMapel').value.trim();
            const statusAbsen = document.getElementById('statusAbsenGuru').value;
            const fileInput = document.getElementById('newFileModul');

            if (!selectedId || !nama || !mapel) {
                alert("Harap pilih nama guru yang bersangkutan!");
                return;
            }

            const fileName = fileInput.files[0] ? fileInput.files[0].name : `Modul Ajar Terbaru - ${mapel}.pdf`;

            // Update data guru yang dipilih
            const guruObj = guruList.find(g => g.id == selectedId);
            if (guruObj) {
                guruObj.modul = fileName;
                guruObj.absenMasuk = statusAbsen;
            }

            showToast("Modul Ajar & Absen Masuk berhasil dikirim!");
            toggleUploadForm();
            document.getElementById('guruListContainer').innerHTML = renderGuruCards(guruList);
        }

        function deleteGuru(id) {
            guruList = guruList.filter(g => g.id !== id);
            document.getElementById('guruListContainer').innerHTML = renderGuruCards(guruList);
            showToast("Data Guru telah dihapus");
        }

        function downloadSimulasi(filename) {
            showToast(`Mengunduh: ${filename}`);
        }

        // Presensi Logic
        function switchClassTab(kelas) {
            selectedClassTab = kelas;
            [7, 8, 9].forEach(k => {
                const tab = document.getElementById(`tab-${k}`);
                if (k === kelas) {
                    tab.className = "flex-1 py-2 text-xs font-bold border-b-2 text-center transition-all border-[#1B365D] text-[#1B365D]";
                } else {
                    tab.className = "flex-1 py-2 text-xs font-bold border-b-2 text-center transition-all border-transparent text-slate-400 hover:text-slate-600";
                }
            });
            document.getElementById('presensiContent').innerHTML = renderPresensiContent(kelas);
        }

        function renderPresensiContent(kelas) {
            const list = dataSiswa[kelas];
            const stats = { Hadir: 0, Sakit: 0, Izin: 0, Alpa: 0 };
            list.forEach(s => stats[s.status]++);

            return `
                <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl mb-3 text-xs border border-slate-200">
                    <span class="font-bold text-slate-700">Rekap:</span>
                    <span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-md font-semibold">H: ${stats.Hadir}</span>
                    <span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded-md font-semibold">S: ${stats.Sakit}</span>
                    <span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded-md font-semibold">I: ${stats.Izin}</span>
                    <span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded-md font-semibold">A: ${stats.Alpa}</span>
                </div>

                ${isAdminLoggedIn ? `
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="addSiswaName" placeholder="Tambah Nama Siswa Baru..." class="flex-1 p-2 bg-slate-50 border border-slate-300 rounded-xl text-xs">
                        <button onclick="addSiswa(${kelas})" class="px-3 py-2 bg-[#1B365D] text-white rounded-xl text-xs font-bold">Tambah</button>
                    </div>
                ` : ''}

                <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                    ${list.map(s => `
                        <div class="p-2.5 bg-white border border-slate-200 rounded-xl flex items-center justify-between text-xs shadow-sm">
                            <div>
                                <span class="font-bold text-slate-800 block">${s.nama}</span>
                                <span class="text-[10px] text-slate-400">JK: ${s.gender}</span>
                            </div>
                            <select onchange="updateStatus(${kelas}, ${s.id}, this.value)" class="py-1 px-2 border border-slate-300 rounded-lg text-xs font-semibold focus:outline-none bg-slate-50">
                                <option value="Hadir" ${s.status === 'Hadir' ? 'selected' : ''}>Hadir</option>
                                <option value="Sakit" ${s.status === 'Sakit' ? 'selected' : ''}>Sakit</option>
                                <option value="Izin" ${s.status === 'Izin' ? 'selected' : ''}>Izin</option>
                                <option value="Alpa" ${s.status === 'Alpa' ? 'selected' : ''}>Alpa</option>
                            </select>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function addSiswa(kelas) {
            const input = document.getElementById('addSiswaName');
            const nama = input.value.trim();
            if (!nama) return;

            dataSiswa[kelas].push({
                id: Date.now(),
                nama: nama,
                gender: "L",
                status: "Hadir"
            });
            input.value = "";
            document.getElementById('presensiContent').innerHTML = renderPresensiContent(kelas);
            showToast("Siswa baru ditambahkan");
        }

        function updateStatus(kelas, id, newStatus) {
            const siswa = dataSiswa[kelas].find(s => s.id === id);
            if (siswa) {
                siswa.status = newStatus;
                document.getElementById('presensiContent').innerHTML = renderPresensiContent(kelas);
                showToast(`Status ${siswa.nama} diubah ke ${newStatus}`);
            }
        }

        // Admin Auth & Functions
        function toggleAdminModal() {
            if (isAdminLoggedIn) {
                isAdminLoggedIn = false;
                document.getElementById('adminBadge').classList.add('hidden');
                document.getElementById('adminBtnText').innerText = "Admin";
                showToast("Logout dari Mode Admin");
            } else {
                document.getElementById('adminLoginModal').classList.remove('hidden');
            }
        }

        function closeAdminLoginModal() {
            document.getElementById('adminLoginModal').classList.add('hidden');
        }

        function verifyAdminLogin() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === 'admin123') {
                isAdminLoggedIn = true;
                closeAdminLoginModal();
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('adminBtnText').innerText = "Logout";
                document.getElementById('adminPassword').value = "";
                showToast("Berhasil masuk Mode Admin!");
            } else {
                showToast("Password Admin Salah!");
            }
        }

        function saveAdminChanges() {
            schoolConfig.schoolName = document.getElementById('editSchoolName').value;
            schoolConfig.ta = document.getElementById('editTA').value;
            schoolConfig.kepalaSekolah.nama = document.getElementById('editKepsekNama').value;
            schoolConfig.kepalaSekolah.nip = document.getElementById('editKepsekNIP').value;
            schoolConfig.kepalaSekolah.pangkat = document.getElementById('editKepsekPangkat').value;
            schoolConfig.rekap.guru = document.getElementById('editJumlahGuru').value;
            schoolConfig.rekap.siswa = document.getElementById('editJumlahSiswa').value;

            // Handle Upload Logo Sekolah (PNG)
            const logoInput = document.getElementById('editLogoInput');
            if (logoInput && logoInput.files && logoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const logoImg = document.getElementById('schoolLogoDisplay');
                    if (logoImg) {
                        logoImg.removeAttribute('onerror');
                        logoImg.src = e.target.result;
                    }
                    schoolConfig.logoUrl = e.target.result;
                };
                reader.readAsDataURL(logoInput.files[0]);
            }

            // Handle Upload Foto Kepala Sekolah
            const kepsekFotoInput = document.getElementById('editKepsekFotoInput');
            if (kepsekFotoInput && kepsekFotoInput.files && kepsekFotoInput.files[0]) {
                const readerFoto = new FileReader();
                readerFoto.onload = function(e) {
                    schoolConfig.kepalaSekolah.foto = e.target.result;
                };
                readerFoto.readAsDataURL(kepsekFotoInput.files[0]);
            }

            // Update UI Real-time
            document.getElementById('schoolNameDisplay').innerText = schoolConfig.schoolName;
            document.getElementById('footerSchoolName').innerText = schoolConfig.schoolName;
            document.getElementById('taDisplay').innerText = schoolConfig.ta;

            closeModal();
            showToast("Perubahan Admin Berhasil Disimpan!");
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('hidden');
        }

        window.addEventListener('click', function(e) {
            const modal = document.getElementById('infoModal');
            if (e.target === modal) closeModal();
        });

        function handleShare() {
            const shareData = {
                title: 'Pojok Data SMPN 8 Padangsidimpuan',
                text: 'Portal Informasi & Presensi Data SMP NEGERI 8 PADANGSIDIMPUAN T.A 2026/2027',
                url: window.location.href
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => copyToClipboard());
            } else {
                copyToClipboard();
            }
        }

        function copyToClipboard() {
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            showToast("Tautan s.id berhasil disalin!");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
